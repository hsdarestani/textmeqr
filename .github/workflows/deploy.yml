name: Deploy TextMeQR to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'migrations/**'
      - 'visual/**'
      - 'wrangler.jsonc'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: textmeqr-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare credentials exist
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository or environment secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository or environment secret" && exit 1)
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run checks
        run: npm run check
      - name: Build UI
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify responsive screens and interactions
        run: npm run test:visual
      - name: Save visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textmeqr-design-review
          path: visual-artifacts/
      - name: Apply D1 migrations
        run: npm run db:remote
      - name: Verify registration secrets exist in GitHub
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          test -n "$AUTH_SECRET" || (echo "Missing AUTH_SECRET secret" && exit 1)
          test -n "$RESEND_API_KEY" || (echo "Missing RESEND_API_KEY secret" && exit 1)
          test -n "$MAIL_FROM" || (echo "Missing MAIL_FROM secret" && exit 1)
          test "${#AUTH_SECRET}" -ge 24 || (echo "AUTH_SECRET must be at least 24 characters" && exit 1)
      - name: Deploy Worker with runtime secrets and custom domain
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          set -euo pipefail
          umask 077
          SECRETS_FILE="$(mktemp)"
          export SECRETS_FILE
          trap 'rm -f "$SECRETS_FILE"' EXIT
          # Generate a private temporary JSON file. Secret values are never printed.
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync(process.env.SECRETS_FILE, JSON.stringify({
              AUTH_SECRET: process.env.AUTH_SECRET,
              RESEND_API_KEY: process.env.RESEND_API_KEY,
              MAIL_FROM: process.env.MAIL_FROM
            }));
          '
          npx wrangler deploy --secrets-file "$SECRETS_FILE"
      - name: Smoke-test deployed registration prerequisites
        run: |
          set -euo pipefail
          ORIGIN="https://textmeqr.smarbiz.sbs"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$ORIGIN/api/health" | jq -e '.ok == true and .service == "textmeqr"'
          READY=0
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error "$ORIGIN/api/config" | jq -e '.notificationsEnabled == true' >/dev/null; then
              READY=1
              break
            fi
            echo "Waiting for Worker secret propagation ($attempt/15)"
            sleep 4
          done
          test "$READY" -eq 1 || (echo "Email settings still not active on the production Worker" && exit 1)
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$ORIGIN/api/auth/me" | jq -e '.user == null'
          # Invalid input must return a safe 400; this does not send any email.
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST "$ORIGIN/api/auth/request" --header 'Content-Type: application/json' --header "Origin: $ORIGIN" --data '{"email":"invalid"}')
          test "$STATUS" = "400" || (echo "Expected 400 for malformed email, got $STATUS" && exit 1)

